MyGlobalPlanner:                                  # Also see: http://wiki.ros.org/global_planner
  old_navfn_behavior: false                     # Exactly mirror behavior of navfn, use defaults for other boolean parameters, default false
  use_quadratic: false                           # Use the quadratic approximation of the potential. Otherwise, use a simpler calculation, default true
  use_dijkstra: false                            # Use dijkstra's algorithm. Otherwise, A*, default true
  use_grid_path: true                          # Create a path that follows the grid boundaries. Otherwise, use a gradient descent method,
  allow_unknown: false                           # Allow planner to plan through unknown space, default true
                                               
  planner_window_x: 0.0                         # default 0.0
  planner_window_y: 0.0                         # default 0.0
  default_tolerance: 0.0                        # If goal in obstacle, plan to the closest point in radius default_tolerance, default 0.0
  
  publish_scale: 100                            # Scale by which the published potential gets multiplied, default 100
  


  lethal_cost: 253 
  distance_tolerance: 0.5
  point_per_meter: 0.02
  distance_check_obstacle: 1.0  
  distance_behind_obstacle: 1.0
  wait_time: 3.0

