controller_server:
  ros__parameters:
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.03
      yaw_goal_tolerance: 0.025
      stateful: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.25
      # Decay follows the marking source and BlindClear removes stale cells in
      # the LiDAR blind sector. A production stack should put its ObstacleLayer
      # before these two project-specific post-processing layers.
      plugins: [decay_obstacle_layer, blind_clear_layer, inflation_layer]
      decay_obstacle_layer:
        plugin: jgl_dwa_local_planner/DecayObstacleLayer
        enabled: true
        input_topic: /livox_pcl0
        decay_time: 0.8
        prune_time: 10.0
        update_bounds_range: 2.2
        min_obstacle_height: 0.2
        max_obstacle_height: 1.2
        obstacle_range: 3.0
        transform_tolerance: 0.2
        lethal_threshold: 254
      blind_clear_layer:
        plugin: jgl_dwa_local_planner/BlindClearLayer
        enabled: true
        min_angle_deg: -110.0
        max_angle_deg: 110.0
        clear_range: 2.2
        keep_radius: 0.15
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.35
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    node_names: [controller_server]
