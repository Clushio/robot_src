controller_server:
  ros__parameters:
    controller_frequency: 10.0
    controller_plugins: [FollowPath]

    FollowPath:
      plugin: jgl_dwa_local_planner/DWAPlannerROS

      # Project-specific straight-line, topology and B-spline behavior.
      brake_distance: 1.0
      lfc: 0.3
      forwNum: 0.1
      pid_PA: 0.6
      pid_PB: 0.4
      frontdis_X: 0.0
      back_distance: 2.5
      jgl_rot_start_angle: 30.0
      jgl_rot_stop_angle: 15.0
      enable_bspline_reference_path: true
      fixed_route_mode: false
      reference_curve_type: bspline
      bspline_sample_resolution: 0.10
      bspline_control_point_spacing: 0.40
      bspline_opt_iterations: 60
      bspline_weight_smooth: 1.0
      bspline_weight_obstacle: 2.0
      bspline_weight_topo: 0.6
      bspline_weight_curvature: 1.0
      safe_distance: 0.10
      reference_occupied_threshold: 98
      max_deviation_from_topo: 0.50
      max_curvature: 2.10
      min_turn_radius: 0.476
      tracking_max_curvature: 1.90
      reference_fallback_boundary_distance: 0.15
      reference_middle_pass_distance: 0.25
      reference_terminal_xy_tolerance: 0.08
      lookahead_distance: 0.50
      v_min: 0.04
      v_max: 0.20
      end_slow_distance: 0.80
      obstacle_slowdown_distance: 1.00
      obstacle_stop_distance: 0.70
      obstacle_wait_time: 10.0
      path_deviation_replan_threshold: 0.60
      path_regenerate_cooldown: 1.0
      k_curve: 1.0
      curvature_filter_tau: 0.25
      max_curvature_rate: 1.5
      curvature_deadband: 0.02
      control_period: 0.10
      yaw_goal_tolerance: 0.025
      xy_goal_tolerance: 0.03
      terminal_yaw_tolerance: 0.04
      terminal_yaw_kp: 1.2
      terminal_yaw_max_speed: 0.25
      terminal_yaw_min_speed: 0.06
      terminal_yaw_stable_cycles: 3

      # ROS1 base_local_planner has no Humble port. The sampling branch uses
      # Nav2 DWB with the closest parameter and critic mapping.
      trajectory_generator_name: dwb_plugins::StandardTrajectoryGenerator
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign,
                PathAlign, PathDist, GoalDist]
      min_vel_x: 0.05
      min_vel_y: 0.0
      max_vel_x: 0.20
      max_vel_y: 0.0
      max_vel_theta: 4.0
      min_speed_xy: 0.01
      max_speed_xy: 0.50
      min_speed_theta: 0.10
      acc_lim_x: 3.0
      acc_lim_y: 0.0
      acc_lim_theta: 4.2
      decel_lim_x: -3.0
      decel_lim_y: 0.0
      decel_lim_theta: -4.2
      vx_samples: 6
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.025
      angular_granularity: 0.10
      transform_tolerance: 0.2
      short_circuit_trajectory_evaluation: true
      stateful: true
      Oscillation.oscillation_reset_dist: 0.03
      BaseObstacle.scale: 0.05
      PathAlign.scale: 55.0
      PathAlign.forward_point_distance: 0.30
      GoalAlign.scale: 20.0
      GoalAlign.forward_point_distance: 0.30
      PathDist.scale: 55.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
